services:
  postgres:
    image: postgres:16-alpine
    container_name: mobilya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sablon
      POSTGRES_PASSWORD: sablon_dev_password
      POSTGRES_DB: mobilya
    ports:
      - "5432:5432"
    volumes:
      - mobilya_pgdata:/var/lib/postgresql/data

volumes:
  mobilya_pgdata:
